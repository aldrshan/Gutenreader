<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gutenberg RSVP & Audio Reader</title>
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #18181d;
      --border: #2c2c35;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container { width: 100%; max-width: 760px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .subtitle { font-size: 13px; color: var(--muted); margin: 0 0 18px; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 15px;
    }
    button, .btn-link {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #23232b;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    button:hover, .btn-link:hover { background: #2f2f3a; }
    button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
    button.primary:hover { opacity: 0.9; }

    #status { font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 18px; }
    #results {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
      max-height: 220px;
      overflow-y: auto;
    }
    .book-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      gap: 12px;
    }
    .book-title { font-weight: 600; font-size: 14px; }
    .book-author { font-size: 12px; color: var(--muted); }

    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: var(--panel);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: border-color 0.15s, background 0.15s;
    }
    #drop-zone.dragover {
      border-color: var(--accent);
      background: #22181b;
      color: var(--text);
    }
    #drop-zone strong { color: var(--text); }

    #reader {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    #book-heading { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
    #word-box {
      height: 130px;
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: 600;
      letter-spacing: 0.5px;
      user-select: none;
    }
    .orp { color: var(--accent); }

    #scrubber {
      width: 100%;
      margin-top: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .meta { margin-top: 14px; font-size: 13px; color: var(--muted); }
    .shortcuts { margin-top: 8px; font-size: 11px; color: #71717a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gutenberg RSVP & Audio Reader</h1>
    <p class="subtitle">
      1. Search below and open the book on Project Gutenberg &rarr; 2. Download <strong>Plain Text UTF-8 (.txt)</strong> &rarr; 3. Drop the file below.
    </p>

    <form id="search-form" class="search-bar">
      <input id="search-input" type="text" placeholder="Search Project Gutenberg (e.g. Pride and Prejudice, Dracula)..." required />
      <button type="submit" class="primary">Search</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>

    <div id="drop-zone">
      <strong>Drop a .txt book file here</strong> or click to browse
      <input id="file-input" type="file" accept=".txt,text/plain" hidden />
    </div>

    <div id="reader">
      <div id="book-heading">No book loaded</div>
      <div id="word-box"><span id="word">Ready</span></div>

      <input id="scrubber" type="range" min="0" max="0" value="0" disabled />

      <div class="controls">
        <button id="btn-back">-20</button>
        <button id="btn-toggle" class="primary">Play</button>
        <button id="btn-fwd">+20</button>
        <label>
          WPM: <span id="wpm-val">350</span>
          <input id="wpm-slider" type="range" min="150" max="1500" step="25" value="350" />
        </label>
        <button id="btn-tts">TTS: Off</button>
      </div>
      <div class="meta" id="meta">Word 0 / 0 (0%)</div>
      <div class="shortcuts">Shortcuts: Space (Play/Pause) &bull; &larr;/&rarr; (&plusmn;20 words) &bull; &uarr;/&darr; (&plusmn;25 WPM)</div>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const bookHeadingEl = document.getElementById("book-heading");
    const wordEl = document.getElementById("word");
    const scrubber = document.getElementById("scrubber");
    const metaEl = document.getElementById("meta");
    const toggleBtn = document.getElementById("btn-toggle");
    const wpmSlider = document.getElementById("wpm-slider");
    const wpmVal = document.getElementById("wpm-val");
    const ttsBtn = document.getElementById("btn-tts");

    let words = [];
    let storageKey = null;
    let index = 0;
    let wpm = 350;
    let playing = false;
    let ttsEnabled = false;
    let timer = null;

    // 1. Search Gutendex and link to official Project Gutenberg landing pages
    searchForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;

      statusEl.textContent = "Searching catalog...";
      resultsEl.innerHTML = "";

      try {
        const res = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!data.results.length) {
          statusEl.textContent = "No books found.";
          return;
        }
        statusEl.textContent = `Found ${data.count.toLocaleString()} results (showing top ${data.results.length}):`;

        data.results.forEach((book) => {
          const author = book.authors.map((a) => a.name).join(", ") || "Unknown";
          const row = document.createElement("div");
          row.className = "book-item";

          const info = document.createElement("div");
          const titleEl = document.createElement("div");
          titleEl.className = "book-title";
          titleEl.textContent = book.title;
          const authorEl = document.createElement("div");
          authorEl.className = "book-author";
          authorEl.textContent = author;
          info.append(titleEl, authorEl);

          const link = document.createElement("a");
          link.className = "btn-link";
          link.href = `https://www.gutenberg.org/ebooks/${book.id}`;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Open on Gutenberg ↗";

          row.append(info, link);
          resultsEl.appendChild(row);
        });
      } catch {
        statusEl.textContent = "Catalog search failed. Please try again.";
      }
    });

    // 2. Local file drop & picker
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) loadLocalFile(file);
    });
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) loadLocalFile(file);
      fileInput.value = "";
    });

    async function loadLocalFile(file) {
      stop();
      let text = await file.text();

      // Strip Project Gutenberg header/footer boilerplate if present
      const startMatch = text.match(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG EBOOK.*?\*\*\*/i);
      const endMatch = text.match(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG EBOOK/i);
      if (startMatch) text = text.slice(startMatch.index + startMatch[0].length);
      if (endMatch) text = text.slice(0, endMatch.index);

      words = text.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
      if (!words.length) {
        statusEl.textContent = "That file appears to be empty.";
        return;
      }

      storageKey = `pg_rsvp_${file.name}_${words.length}`;
      const saved = Number(localStorage.getItem(storageKey) || 0);
      index = Math.min(saved, words.length - 1);

      scrubber.disabled = false;
      scrubber.max = words.length - 1;
      bookHeadingEl.textContent = file.name.replace(/\.txt$/i, "");
      statusEl.textContent = `Loaded "${file.name}" (${words.length.toLocaleString()} words).`;
      render();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function formatWord(word) {
      if (!word) return "";
      const orpIndex = Math.min(Math.floor(word.length * 0.3), word.length - 1);
      const before = escapeHtml(word.slice(0, orpIndex));
      const pivot = escapeHtml(word[orpIndex]);
      const after = escapeHtml(word.slice(orpIndex + 1));
      return `${before}<span class="orp">${pivot}</span>${after}`;
    }

    function savePosition() {
      if (storageKey) localStorage.setItem(storageKey, index);
    }

    function render() {
      if (!words.length) return;
      wordEl.innerHTML = formatWord(words[index]);
      scrubber.value = index;
      const pct = ((index / words.length) * 100).toFixed(1);
      metaEl.textContent = `Word ${(index + 1).toLocaleString()} / ${words.length.toLocaleString()} (${pct}%)`;
    }

    // 3. RSVP Playback Loop
    function stepRSVP() {
      if (!playing || ttsEnabled) return;
      if (index >= words.length) return stop();

      const current = words[index];
      render();
      index++;
      if (index % 15 === 0) savePosition();

      let delay = 60000 / wpm;
      if (/[.!?]$/.test(current)) delay *= 2.0;
      else if (/[,;:]$/.test(current)) delay *= 1.4;

      timer = setTimeout(stepRSVP, delay);
    }

    // 4. Browser TTS Playback
    function speakChunk() {
      if (!playing || !ttsEnabled || index >= words.length) return;
      window.speechSynthesis.cancel();

      const chunkStart = index;
      const chunkWords = words.slice(chunkStart, chunkStart + 40);
      const utterance = new SpeechSynthesisUtterance(chunkWords.join(" "));
      utterance.rate = Math.min(Math.max(wpm / 180, 0.5), 3.0);

      const offsets = [];
      let pos = 0;
      for (const w of chunkWords) {
        offsets.push(pos);
        pos += w.length + 1;
      }

      utterance.onboundary = (e) => {
        if (e.name !== "word") return;
        const wordOffset = offsets.findLastIndex((o) => o <= e.charIndex);
        if (wordOffset !== -1) {
          index = chunkStart + wordOffset;
          render();
        }
      };

      utterance.onend = () => {
        if (!playing || !ttsEnabled) return;
        index = chunkStart + chunkWords.length;
        savePosition();
        speakChunk();
      };

      window.speechSynthesis.speak(utterance);
    }

    function start() {
      if (!words.length) return;
      playing = true;
      toggleBtn.textContent = "Pause";
      if (ttsEnabled) speakChunk();
      else stepRSVP();
    }

    function stop() {
      playing = false;
      toggleBtn.textContent = "Play";
      clearTimeout(timer);
      window.speechSynthesis.cancel();
      savePosition();
    }

    function seek(newIndex) {
      if (!words.length) return;
      const was = playing;
      stop();
      index = Math.max(0, Math.min(words.length - 1, newIndex));
      render();
      if (was) start();
    }

    // Controls & Keyboard Shortcuts
    toggleBtn.addEventListener("click", () => (playing ? stop() : start()));
    document.getElementById("btn-back").addEventListener("click", () => seek(index - 20));
    document.getElementById("btn-fwd").addEventListener("click", () => seek(index + 20));
    scrubber.addEventListener("input", (e) => seek(Number(e.target.value)));

    wpmSlider.addEventListener("input", (e) => {
      wpm = Number(e.target.value);
      wpmVal.textContent = wpm;
    });

    ttsBtn.addEventListener("click", () => {
      const was = playing;
      stop();
      ttsEnabled = !ttsEnabled;
      ttsBtn.textContent = `TTS: ${ttsEnabled ? "On" : "Off"}`;
      if (was) start();
    });

    document.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput || !words.length) return;
      if (e.code === "Space") {
        e.preventDefault();
        playing ? stop() : start();
      } else if (e.code === "ArrowLeft") {
        seek(index - 20);
      } else if (e.code === "ArrowRight") {
        seek(index + 20);
      } else if (e.code === "ArrowUp") {
        e.preventDefault();
        wpm = Math.min(1500, wpm + 25);
        wpmSlider.value = wpm;
        wpmVal.textContent = wpm;
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        wpm = Math.max(150, wpm - 25);
        wpmSlider.value = wpm;
        wpmVal.textContent = wpm;
      }
    });
  </script>
</body>
</html>
